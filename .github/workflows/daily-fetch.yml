# Based on: github-weekly-reporter setup
# Docs: https://github.com/deariary/github-weekly-reporter

name: Daily Fetch

on:
  schedule:
    - cron: '0 8 * * *'  # midnight America/Los_Angeles (PST; 11pm during PDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: deariary/github-weekly-reporter@main
        with:
          github-token: ${{ secrets.GH_PAT }}
          username: 'eBlackrose'
          mode: 'daily'
          language: 'en'
          timezone: 'America/Los_Angeles'
